    window.updateSlotField = function(fId, slotN, ioId, field, val) {
        const d = projectData.details.find(x => x.id === activeDetailId); 
        const f = d.frames.find(x => x.id === fId);
        if(!f.slots[`slot-${slotN}`].ioData) f.slots[`slot-${slotN}`].ioData = {};
        
        const slot = f.slots[`slot-${slotN}`]; 
        const cData = slot.ioData[ioId] || {bezeichnung:'', art:'TA'};
        
        if (field === 'bezeichnung') {
            const ic = iconConfigList.find(x => x.file === slot.iconFile);
            const slotLabel = ic ? ic.label : 'Platz';
            const oldBezeichnung = cData.bezeichnung || `${slotLabel} (Platz ${slotN})`;
            const newBezeichnung = val || `${slotLabel} (Platz ${slotN})`;
            
            const oldIdent = `${d.name} | ${f.name} | Platz ${slotN} | ${oldBezeichnung}`;
            const newIdent = `${d.name} | ${f.name} | Platz ${slotN} | ${newBezeichnung}`;
            
            replaceStringInAllReferences(oldIdent, newIdent);
        }
        
        cData[field] = val; 
        slot.ioData[ioId] = cData;
        
        saveToLocal();
        renderApp();
    };

    window.updateSlotProperty = function(fId, slotN, field, val) {
        const d = projectData.details.find(x => x.id === activeDetailId);
        if(!d) return;
        const f = d.frames.find(x => x.id === fId);
        if(!f) return;
        const slot = f.slots[`slot-${slotN}`];
        if(!slot) return;
        slot[field] = val;
        saveToLocal();
        renderApp();
    };

    function updateSlotCustomField(fId, slotN, fieldName, val) {
        const d = projectData.details.find(x => x.id === activeDetailId); 
        if(!d) return;
        const f = d.frames.find(x => x.id === fId);
        if(!f) return;
        const slot = f.slots[`slot-${slotN}`];
        if(!slot) return;
        
        if(!slot.customFields) slot.customFields = {};
        slot.customFields[fieldName] = val;
        saveToLocal();
        renderApp();
    }

    function getFieldBusType(fieldName) {
        if (!fieldName) return null;
        const name = fieldName.toLowerCase();
        
        for (const [busKey, config] of Object.entries(SYSTEM_CONFIG.busTypes)) {
            const cleanKey = busKey.toLowerCase();
            const cleanLabel = config.label.toLowerCase().replace(/[^a-z0-9]/g, '');
            
            if (name.includes(cleanKey) || name.includes(cleanLabel)) {
                return busKey;
            }
        }
        
        if (name.includes('1-wire') || name.includes('wire')) return '1wire';
        
        return null;
    }

    window.updateHwFieldEx = function(hwOrId, dataBlock, ioId, val) {
        let hw = typeof hwOrId === 'string' ? projectData.details.find(x => x.id === activeDetailId).hardware.find(h => h.instanceId === hwOrId) : hwOrId;

    function getAllBusNodes(slaveType=null) {
        let list = [];
        projectData.details.forEach(d => d.hardware && d.hardware.forEach(hw => {
            const c = hardwareConfigList.find(x => x.id === hw.configId);
            if(c) {
                const activeIo = c.profiles ? (c.profiles.find(p=>p.id===hw.activeProfile)?.io || c.profiles[0].io) : c.io;
                if(activeIo) activeIo.forEach(io => {
                    if(io.type === 'bus' || io.busType) {
                        const bType = io.busType || (io.label && io.label.toLowerCase().includes('dali') ? 'dali' : null);
                        if(!slaveType || slaveType === bType || slaveType === 'unknown' || bType === 'unknown') {
                            list.push({value: getBusIdString(d, hw, io)});
                        }
                    }
                });
            }
        }));
        return list;
    }

    function getParentBusId(hw) {
        for (let fieldName in hw.fields) {
            if (/ast|bus|link|bridge|dali/i.test(fieldName) && hw.fields[fieldName]) {
                return hw.fields[fieldName];
            }
        }
        return null;
    }

    function getDeviceChannelCount(childItem) {
        if (childItem.cfg.channels) return parseInt(childItem.cfg.channels);
        let fieldChannels = parseInt(childItem.hw.fields['Kanäle'] || childItem.hw.fields['Channels'] || 0);
        if (fieldChannels > 0) return fieldChannels;
        
        const activeIo = childItem.cfg.profiles ? 
            (childItem.cfg.profiles.find(p => p.id === childItem.hw.activeProfile)?.io || childItem.cfg.profiles[0].io) : 
            childItem.cfg.io;
        
        if (activeIo && childItem.hw.subNodes) {
            let subSum = 0;
            for (let ioKey in childItem.hw.subNodes) {
                childItem.hw.subNodes[ioKey].forEach(sub => {
                    subSum += parseInt(sub.channels) || 1;
                });
            }
            if (subSum > 0) return subSum;
        }
        return 1;
    }

    function openBusOverviewModal() {
        const c = document.getElementById('bus-tree-content'); c.innerHTML = ''; let h = '';
        
        const allHw = [];
        
        projectData.details.forEach(d => d.hardware && d.hardware.forEach(hw => {
            const cfg = hardwareConfigList.find(x => x.id === hw.configId);
            if(cfg) allHw.push({d, hw, cfg});
        }));

        projectData.details.forEach(d => {
            if (d.frames) {
                d.frames.forEach(f => {
                    for (let slotKey in f.slots) {
                        const slot = f.slots[slotKey];
                        if (slot && slot.iconFile) {
                            const cfg = iconConfigList.find(x => x.file === slot.iconFile);
                            if (cfg && slot.customFields) {
                                const hasBusField = Object.keys(slot.customFields).some(k => /ast|bus|link|bridge|dali/i.test(k) && slot.customFields[k]);
                                if (hasBusField) {
                                    allHw.push({
                                        d: d,
                                        hw: { fields: slot.customFields, configId: slot.iconFile },
                                        cfg: { name: cfg.label, channels: cfg.channels || 1, io: [] }
                                    });
                                }
                            }
                        }
                    }
                });
            }
        });

        const totalPower = getProjectTotalPower();
        h += `<div style="margin-bottom:25px; font-weight:700; color:#0f766e; font-size:1.1rem; padding-bottom:10px; border-bottom:1px solid #cbd5e1;">⚡ Gesamtstromaufnahme Projekt: ${totalPower.toFixed(1)} W</div>`;

        function renderTopoNode(item, level) {
            const isRoot = level === 0;
            const activeIo = item.cfg.profiles ? (item.cfg.profiles.find(p=>p.id===item.hw.activeProfile)?.io || item.cfg.profiles[0].io) : item.cfg.io;

            let html = `<div class="topo-master" style="${isRoot ? '' : 'margin-top: 10px; margin-bottom: 5px; border-color:#e2e8f0; box-shadow:none;'}">
                <div class="topo-master-title" style="${isRoot ? '' : 'font-size:1rem; color:#1e293b;'}">
                    ${isRoot ? '🖥️' : '🔌'} ${item.hw.fields['Geräte-Bez.'] || item.cfg.name} 
                    <span style="color:#64748b; font-size:0.85rem; font-weight:normal;">(${item.d.room ? item.d.room + ' - ' : ''}${item.d.name})</span>
                </div>`;
            
            if (activeIo) {
                activeIo.filter(i => i.type === 'bus').forEach(io => {
                    const busIdStr = getBusIdString(item.d, item.hw, io);
                    const children = allHw.filter(c => getParentBusId(c.hw) === busIdStr);
                    const busCfg = SYSTEM_CONFIG.busTypes[io.busType];
                    
                    const maxLimit = io.limit || (busCfg ? busCfg.defaultLimit : null) || (io.busType === 'tree' ? 50 : io.busType === 'air' ? 50 : io.busType === 'link' ? 30 : 64);
                    
                    if (busCfg && busCfg.hasSubDevices) {
                        const subs = (item.hw.subNodes && item.hw.subNodes[io.id]) || [];
                        let totalAddrs = 0;
                        subs.forEach(s => { totalAddrs += parseInt(s.channels) || 1; });
                        children.forEach(child => { totalAddrs += getDeviceChannelCount(child); });

                        const isFull = totalAddrs >= maxLimit;
                        
                        html += `<div class="topo-bus">
                            <div class="topo-bus-title">
                                <span>${busCfg.icon} ${io.label}</span>
                                <span class="topo-badge ${isFull ? 'full' : 'ok'}">${totalAddrs}/${maxLimit} Belegt</span>
                            </div>`;
                
                        if(subs.length === 0 && children.length === 0) {
                            html += `<div class="topo-device" style="color:#94a3b8; font-style:italic; justify-content:center;">Keine Geräte angelegt</div>`;
                        } else {
                            subs.forEach(sub => {
                                let ch = parseInt(sub.channels) || 1;
                                html += `<div class="topo-device">
                                        <div style="font-weight:600; color:#1e293b;">${sub.name || 'Ohne Bezeichnung'}</div>
                                        <div class="topo-device-info">
                                            <span>📍 ${sub.location || '-'}</span>
                                            ${sub.gruppe ? `<span style="margin-left:8px;">🏷️ ${sub.gruppe}</span>` : ''}
                                            <span style="color:#0f766e; font-weight:bold; margin-left:8px;">💡 ${ch} Adr.</span>
                                        </div>
                                       </div>`;
                            });
                            children.forEach(child => {
                                let childCh = getDeviceChannelCount(child);
                                html += `<div class="topo-device">
                                        <div style="font-weight:600; color:#1e293b;">🔌 ${child.hw.fields['Geräte-Bez.'] || child.cfg.name}</div>
                                        <div class="topo-device-info">
                                            <span>📍 ${child.d.name}</span>
                                            <span style="color:#0f766e; font-weight:bold;">💡 ${childCh} Adr.</span>
                                        </div>
                                       </div>`;
                            });
                        }
                        html += `</div>`;
                    } else {
                        let usedCount = 0;
                        children.forEach(child => { usedCount += getDeviceChannelCount(child); });
                        const isFull = usedCount >= maxLimit;

                        html += `<div class="topo-bus">
                            <div class="topo-bus-title">
                                <span>📶 ${io.label}</span>
                                <span class="topo-badge ${isFull ? 'full' : 'ok'}">${usedCount}/${maxLimit} Belegt</span>
                            </div>`;
                
                        if (children.length > 0) {
                            children.forEach(child => { html += renderTopoNode(child, level + 1); });
                        } else {
                            html += `<div class="topo-device" style="color:#94a3b8; font-style:italic; justify-content:center; background:transparent; border:none; box-shadow:none;">Keine Geräte angehängt</div>`;
                        }
                        html += `</div>`;
                    }
                });
            }
            html += `</div>`;
            return html;
        }

        const roots = allHw.filter(item => !getParentBusId(item.hw));
        roots.forEach(root => { h += renderTopoNode(root, 0); });
        
        c.innerHTML = h; 
        document.getElementById('bus-modal').style.display = 'flex';
    }

    function getHardwareLinksForSwitch(switchIdent) {
        let linkedAppFns = new Set();
        let linkedGroups = new Set();

        projectData.details.forEach(det => {
            if(det.hardware) {
                det.hardware.forEach(hw => {
                    if(hw.mappings) {
                        for(let ioId in hw.mappings) {
                            let mapList = (hw.mappings[ioId] || '').split(',').map(x=>x.trim());
                            if(mapList.includes(switchIdent)) {
                                if(hw.appFunctions && hw.appFunctions[ioId]) {
                                    hw.appFunctions[ioId].split(',').map(x=>x.trim()).filter(x=>x).forEach(x => linkedAppFns.add(x));
                                }
                                if(hw.globalGroup && hw.globalGroup[ioId]) {
                                    hw.globalGroup[ioId].split(',').map(x=>x.trim()).filter(x=>x).forEach(x => linkedGroups.add(x));
                                }
                            }
                        }
                    }
                    if(hw.subNodes) {
                        for(let ioId in hw.subNodes) {
                            hw.subNodes[ioId].forEach(sub => {
                                if(sub.mapping) {
                                    let mapList = sub.mapping.split(',').map(x=>x.trim());
                                    if(mapList.includes(switchIdent)) {
                                        if(sub.appFunctions) {
                                            sub.appFunctions.split(',').map(x=>x.trim()).filter(x=>x).forEach(x => linkedAppFns.add(x));
                                        }
                                        if(sub.globalGroup) {
                                            sub.globalGroup.split(',').map(x=>x.trim()).filter(x=>x).forEach(x => linkedGroups.add(x));
                                        }
                                    }
                                }
                            });
                        }
                    }
                });
            }
        });

        return {
            appFns: Array.from(linkedAppFns).join(', '),
            groups: Array.from(linkedGroups).join(', ')
        };
    }

    function parseSlotLinks(dat, hwLinks) {
        let rawEingabe = (dat.eingabegerat || '').split(',').map(x=>x.trim()).filter(x=>x);
        let targetHw = [];
        let directApp = [];
        let directGrp = [];
        
        let appFnNames = projectData.appFunctions.map(a => typeof a === 'object' ? a.name : a);
        let grpNames = projectData.globalGroups.map(g => typeof g === 'object' ? g.name : g);

        rawEingabe.forEach(item => {
            if(appFnNames.includes(item)) directApp.push(item);
            else if(grpNames.includes(item)) directGrp.push(item);
            else targetHw.push(item);
        });

        let combinedApp = [...directApp, ...(hwLinks.appFns ? hwLinks.appFns.split(',') : [])].map(x=>x.trim()).filter(x=>x);
        let uniqueApp = [...new Set(combinedApp)].join(', ');

        let combinedGrp = [dat.gruppe, ...directGrp, ...(hwLinks.groups ? hwLinks.groups.split(',') : [])].map(x=>typeof x === 'string' ? x.trim() : '').filter(x=>x);
        let uniqueGrp = [...new Set(combinedGrp)].join(', ');

        return { targetHw: targetHw.join(', '), uniqueApp, uniqueGrp };
    }

        if(hasFrames) {
            d.frames.forEach(f => {
                const [r, c] = f.layout.split('x').map(Number);
                const total = r * c;
                let vSlots = '';
                let slotListHtml = '';

                for(let i=1; i<=total; i++) {
                    const s = f.slots[`slot-${i}`] || { iconFile: '', ioData: {}, printInCustomerDoc: true };
                    const ic = iconConfigList.find(x => x.file === s.iconFile);

                    const imgPath = ic ? `icons-schalter/${ic.file}` : 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23cbd5e1"><circle cx="12" cy="12" r="8"></circle></svg>';
                    vSlots += `<div class="print-switch-slot"><span style="position:absolute; top:2px; left:4px; font-size:9px; font-weight:700; color:#64748b;">${i}</span><img src="${imgPath}"></div>`;

                    if (s.printInCustomerDoc === false) continue;

                    let slotText = '';
                    const hasIoDefinitions = ic && ic.io && ic.io.length > 0;

                    if (hasIoDefinitions) {
                        ic.io.forEach(io => {
                            const dat = s.ioData?.[io.id] || {};
                            if (dat.bezeichnung || dat.funktion || dat.gruppe) {
                                slotText += `<div style="margin-bottom: 4px;">
                                    <b>${io.label}: ${dat.bezeichnung || 'Taster'}</b>
                                    ${dat.funktion ? `<div style="color:#475569;">Funktion: ${dat.funktion}</div>` : ''}
                                    ${dat.gruppe ? `<div style="color:#475569;">Gruppe: ${dat.gruppe}</div>` : ''}
                                </div>`;
                            }
                        });
                    } else {
                        const dat = s.ioData?.['default'] || {};
                        const slotLabel = ic ? ic.label : 'Platz';
                        const customBez = dat.bezeichnung ? dat.bezeichnung : `${slotLabel} (Platz ${i})`;
                        const switchIdent = `${d.name} | ${f.name} | Platz ${i} | ${customBez}`;
                        
                        const hwLinks = getHardwareLinksForSwitch(switchIdent);
                        const parsed = parseSlotLinks(dat, hwLinks);

                        if(dat.bezeichnung || dat.funktion || parsed.targetHw || parsed.uniqueApp || parsed.uniqueGrp) {
                            slotText += `<div style="margin-bottom: 4px;">`;
                            if(dat.bezeichnung) slotText += `<b>Platz ${i} - ${dat.bezeichnung}</b>`;
                            else slotText += `<b>Platz ${i} - ${slotLabel}</b>`;
                            
                            if(dat.funktion) slotText += `<div style="color:#475569;">Funktion: ${dat.funktion}</div>`;
                            if(parsed.targetHw) slotText += `<div style="color:#0f766e;">Verknüpfung (Hardware): ${parsed.targetHw}</div>`;
                            if(parsed.uniqueApp) slotText += `<div style="color:#475569;">App-Funktionen: ${parsed.uniqueApp}</div>`;
                            if(parsed.uniqueGrp) slotText += `<div style="color:#475569;">Gruppen: ${parsed.uniqueGrp}</div>`;
                            slotText += `</div>`;
                        }
                    }
                    
                    if(slotText) {
                        slotListHtml += `<div style="margin-bottom: 8px; padding-left: 10px; border-left: 3px solid var(--primary);">${slotText}</div>`;
                    } else {
                        slotListHtml += `<div style="margin-bottom: 8px; padding-left: 10px; border-left: 3px solid #cbd5e1; color:#94a3b8;"><b>Platz ${i}</b> - Nicht belegt</div>`;
                    }
                }

                html += `<div style="margin-top: 15px;">
                    <h4 style="margin-bottom:10px;">${f.name}</h4>
                    <div style="display:flex; gap: 30px; align-items: flex-start;">
                        <div class="print-switch-frame" style="grid-template-columns: repeat(${c}, 60px); flex-shrink:0;">${vSlots}</div>
                        <div style="flex:1;">${slotListHtml}</div>
                    </div>
                </div>`;
            });
        }

        if(hasHardware) {
            html += `<div style="margin-top: 25px;">
                <h4 style="margin-bottom:12px; color:#1e293b; font-size: 1.05rem;">Zugehörige Hardware</h4>
                <div style="display:flex; flex-direction:column; gap:12px;">`;
            
            selectedHw.forEach(hw => {
                const cfg = hardwareConfigList.find(x => x.id === hw.configId);
                if(!cfg) return;

                let fieldsHtml = '';
                if(cfg.fields) {
                    cfg.fields.forEach(f => {
                        if (hw.fields[f] && !/ast|bus|bridge|dali|link|bemerkung|s\.-?nr|seriennummer/i.test(f)) {
                            fieldsHtml += `<div style="margin-bottom:2px;"><b>${f}:</b> ${hw.fields[f]}</div>`;
                        }
                    });
                }

                let ioh = ''; 
                const activeIoList = cfg.profiles ? (cfg.profiles.find(p => p.id === hw.activeProfile)?.io || cfg.profiles[0].io) : cfg.io;
                
                if(activeIoList) {
                    activeIoList.forEach(io => { 
                        const shouldPrintConnect = cfg.printHardwareConnect || io.printHardwareConnect;

                        if(io.type === 'bus' && hw.subNodes && hw.subNodes[io.id]) {
                            hw.subNodes[io.id].forEach(sub => {
                                if (sub.printInCustomerDoc || shouldPrintConnect) {
                                    ioh += `<div style="margin-bottom: 6px; padding-left: 8px; border-left: 3px solid var(--primary); font-size: 0.8rem; color: #475569;">
                                        <b style="color:#1e293b;">${sub.name || 'Gerät'}</b>${sub.location ? ` <span style="color:#64748b;">(Ort: ${sub.location})</span>` : ''}
                                        ${sub.gruppe ? `<div><b>Gruppe:</b> ${sub.gruppe}</div>` : ''}
                                        ${sub.funktion ? `<div><b>Funktion:</b> ${sub.funktion}</div>` : ''}
                                        ${sub.mapping ? `<div><b>Taster / Verknüpfung:</b> ${sub.mapping}</div>` : ''}
                                        ${sub.appFunctions ? `<div><b>App-Funktionen:</b> ${sub.appFunctions}</div>` : ''}
                                        ${sub.globalGroup ? `<div><b>Globale Gruppe:</b> ${sub.globalGroup}</div>` : ''}
                                    </div>`;
                                }
                            });
                        } else {
                            if ((hw.ioPrint && hw.ioPrint[io.id]) || shouldPrintConnect) {
                                const app = hw.appFunctions?.[io.id];
                                const grp = hw.globalGroup?.[io.id];
                                const map = hw.mappings?.[io.id];
                                const bez = hw.bezeichnung?.[io.id];
                                const func = hw.funktion?.[io.id];
                                const localGrp = hw.gruppe?.[io.id];
                                
                                ioh += `<div style="margin-bottom: 6px; padding-left: 8px; border-left: 3px solid var(--primary); font-size: 0.8rem; color: #475569;">
                                    <b style="color:#1e293b;">${io.label}${bez ? ` - ${bez}` : ''}</b>
                                    ${localGrp ? `<div><b>Gruppe:</b> ${localGrp}</div>` : ''}
                                    ${func ? `<div><b>Funktion:</b> ${func}</div>` : ''}
                                    ${map ? `<div><b>Taster / Verknüpfung:</b> ${map}</div>` : ''}
                                    ${app ? `<div><b>App-Funktionen:</b> ${app}</div>` : ''}
                                    ${grp ? `<div><b>Globale Gruppe:</b> ${grp}</div>` : ''}
                                </div>`;
                            }
                        }
                    });
                }

                if (ioh || fieldsHtml) {
                    html += `
                        <div style="display:flex; gap:15px; border:1px solid #cbd5e1; padding:12px; border-radius:6px; background:#f8fafc; page-break-inside: avoid; border-left:4px solid var(--primary); margin-bottom:12px;">
                            <div style="width:70px; flex-shrink:0; align-self: flex-start;">
                                <img src="icons-schalter/${cfg.image}" style="width:100%; object-fit:contain; border-radius:4px; background:#fff; border:1px solid #e2e8f0; padding:4px;">
                            </div>
                            <div style="flex:1; font-size:0.85rem; color:#334155;">
                                <div style="font-weight:bold; font-size:1rem; color:#0f766e; margin-bottom:6px; border-bottom:1px solid #cbd5e1; padding-bottom:4px;">
                                    ${cfg.name}
                                </div>
                                <div style="margin-bottom:8px; display:grid; grid-template-columns:1fr 1fr; gap:4px;">${fieldsHtml}</div>
                                ${ioh ? `<div style="margin-top:8px; border-top:1px dashed #cbd5e1; padding-top:6px;"><b>Zugehörige Funktionen & Verknüpfungen:</b>${ioh}</div>` : ''}
                            </div>
                        </div>`;
                }
            });
            html += `</div></div>`;
        }

        html += `</div>`;
    });
    html += `</div>`;

    let hasGlobals = (projectData.appFunctions && projectData.appFunctions.length > 0) ||
                     (projectData.globalGroups && projectData.globalGroups.length > 0) ||
                     (projectData.globalFunctions && projectData.globalFunctions.length > 0);
    
    if (hasGlobals) {
        let renderItemsList = (list) => {
            if (!list || list.length === 0) return '<div style="font-size:0.9rem; color:#94a3b8; font-style:italic;">Keine Einträge</div>';
            return list.map(item => {
                const name = typeof item === 'object' ? item.name : item;
                const desc = typeof item === 'object' ? item.description : '';
                return `<div style="margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid #e2e8f0; page-break-inside: avoid;">
                    <div style="font-size:1rem; font-weight:600; color:#1e293b;">${name}</div>
                    ${desc ? `<div style="font-size:0.85rem; color:#475569; margin-top:4px;">${desc}</div>` : ''}
                </div>`;
            }).join('');
        };

        html += `<div class="print-detail-page" style="page-break-before: always;">
            <div class="print-header-block"><h2>Zentrale Einstellungen & Erklärungen</h2></div>`;
        
        if (projectData.globalFunctions && projectData.globalFunctions.length > 0) {
            html += `<div><h3 style="color:#0f766e; border-bottom:1px solid #cbd5e1; padding-bottom:4px;">Globale Funktionen</h3>
                     <p style="font-size:0.85rem; color:#64748b; margin-top:0;">Erklärung der verwendeten Taster-Funktionen im Projekt.</p>
                     ${renderItemsList(projectData.globalFunctions)}</div><br>`;
        }
        if (projectData.globalGroups && projectData.globalGroups.length > 0) {
            html += `<div><h3 style="color:#0f766e; border-bottom:1px solid #cbd5e1; padding-bottom:4px;">Globale Gruppen</h3>
                     <p style="font-size:0.85rem; color:#64748b; margin-top:0;">Gruppenfunktionen, die über mehrere Räume hinweg wirken.</p>
                     ${renderItemsList(projectData.globalGroups)}</div><br>`;
        }
        if (projectData.appFunctions && projectData.appFunctions.length > 0) {
            html += `<div><h3 style="color:#0f766e; border-bottom:1px solid #cbd5e1; padding-bottom:4px;">App-Funktionen</h3>
                     <p style="font-size:0.85rem; color:#64748b; margin-top:0;">Funktionen, die in der Smart Home App verfügbar sind.</p>
                     ${renderItemsList(projectData.appFunctions)}</div>`;
        }
        html += `</div>`;
    }

    document.getElementById('print-customer-container').innerHTML = html;
    
    document.getElementById('print-single-container').style.display = 'none';
    document.getElementById('print-all-container').style.display = 'none';
    document.getElementById('print-customer-container').style.display = 'block';
    
    window.print();
    
    setTimeout(() => { document.getElementById('print-customer-container').style.display = 'none'; }, 500);
}

    function printCurrentDetail() {
        document.getElementById('print-single-container').style.display = 'block';
        document.getElementById('print-all-container').style.display = 'none';
        window.print();
        setTimeout(() => { document.getElementById('print-single-container').style.display = 'none'; }, 500);
    }

    function printAllDetails() {
        document.getElementById('print-single-container').style.display = 'none';
        document.getElementById('print-all-container').style.display = 'block';
        window.print();
        setTimeout(() => { document.getElementById('print-all-container').style.display = 'none'; }, 500);
    }

    function exportProject() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const timestamp = `${year}-${month}-${day}_${hours}-${minutes}`;

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(projectData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `${projectData.projectName || 'Projekt'}_${timestamp}.ServiceProDetail`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function importProject(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const parsed = JSON.parse(e.target.result);
                if(parsed && parsed.details) {
                    projectData = migrateProjectData(parsed);
                    activeDetailId = projectData.details.length > 0 ? projectData.details[0].id : null;
                    renderApp();
                    alert("Projekt erfolgreich geladen!");
                } else {
                    alert("Ungültiges Dateiformat.");
                }
            } catch(err) {
                alert("Fehler beim Lesen der Datei: " + err.message);
            }
        };
        reader.readAsText(file);
    }
</script>
</body>
</html>
