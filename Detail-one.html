    function updateSlotField(fId, slotN, ioId, field, val) {
        const d = projectData.details.find(x => x.id === activeDetailId); const f = d.frames.find(x => x.id === fId);
        if(!f.slots[`slot-${slotN}`].ioData) f.slots[`slot-${slotN}`].ioData = {};
        const slot = f.slots[`slot-${slotN}`]; const cData = slot.ioData[ioId] || {bezeichnung:'', art:'TA'};
        
        if (field === 'bezeichnung') {
            const ic = iconConfigList.find(x => x.file === slot.iconFile);
            if(ic) {
                const oldBezeichnung = cData.bezeichnung || `${ic.label} (Platz ${slotN})`;
                const newBezeichnung = val || `${ic.label} (Platz ${slotN})`;
                replaceStringInAllReferences(`${d.name} ${oldBezeichnung}`, `${d.name} ${newBezeichnung}`);
            }
        }
        cData[field] = val; slot.ioData[ioId] = cData;
        renderApp();
    }

    function updateSlotCustomField(fId, slotN, fieldName, val) {
        const d = projectData.details.find(x => x.id === activeDetailId); 
        if(!d) return;
        const f = d.frames.find(x => x.id === fId);
        if(!f) return;
        const slot = f.slots[`slot-${slotN}`];
        if(!slot) return;
        
        if(!slot.customFields) slot.customFields = {};
        slot.customFields[fieldName] = val;
        saveToLocal();
        renderApp();
    }

    function getFieldBusType(fieldName) {
        if (!fieldName) return null;
        const name = fieldName.toLowerCase();
        
        for (const [busKey, config] of Object.entries(SYSTEM_CONFIG.busTypes)) {
            const cleanKey = busKey.toLowerCase();
            const cleanLabel = config.label.toLowerCase().replace(/[^a-z0-9]/g, '');
            
            if (name.includes(cleanKey) || name.includes(cleanLabel)) {
                return busKey;
            }
        }
        
        if (name.includes('1-wire') || name.includes('wire')) return '1wire';
        
        return null;
    }

    function generateHardwareHtml(d) {
        if(!d.hardware.length) return '<p class="no-print" style="color:#64748b;">Noch keine Komponenten zugewiesen.</p>';
        
        return d.hardware.map(hw => {
            const cfg = hardwareConfigList.find(x => x.id === hw.configId); if(!cfg) return '';
            
            let profileHtml = '';
            let activeIoList = cfg.io || [];
            if(cfg.profiles) {
                const selProfile = cfg.profiles.find(p => p.id === hw.activeProfile) || cfg.profiles[0];
                activeIoList = selProfile.io;
                profileHtml = `<div class="form-group" style="background:#fef3c7; padding:8px; border-radius:4px;"><label>Geräte-Profil:</label>
                    <select style="flex:1; padding:6px; font-weight:bold;" onchange="changeHwProfile('${hw.instanceId}', this.value)">
                        ${cfg.profiles.map(p => `<option value="${p.id}" ${hw.activeProfile === p.id ? 'selected':''}>${p.label}</option>`).join('')}
                    </select>
                </div>`;
            }

            let fHtml = profileHtml; let inHtml = ''; let outHtml = ''; let busHtml = '';

            if(cfg.fields) cfg.fields.forEach(f => {
                if(/ast|bus|bridge|dali|link/i.test(f)) {
                    const fn = `setHwF_${hw.instanceId}_${sanitizeFnName(f)}`;
                    window[fn] = (v, ev) => { 
                        if(ev){ev.preventDefault();ev.stopPropagation();} 
                        document.querySelectorAll('.select-items').forEach(x=>x.classList.remove('show')); 
                        setTimeout(() => { updateHardwareField(hw.instanceId, f, v); }, 10); 
                    };
                    const expectedType = getFieldBusType(f);
                    const busNodes = getAllBusNodes(expectedType);
                    fHtml += `<div class="form-group"><label>${f}</label><div>${renderStandardDropdown(`hf-${hw.instanceId}-${sanitizeFnName(f)}`, hw.fields[f]||'', [{value:'', label:'--- Keine Zuordnung ---'}, ...busNodes], fn, 'Bus...')}</div></div>`;
                } else {
                    fHtml += `<div class="form-group"><label>${f}</label><input type="text" value="${hw.fields[f]||''}" onchange="updateHardwareField('${hw.instanceId}', '${f}', this.value)"></div>`;
                }
            });

            activeIoList.forEach(io => {
                if(io.type === 'bus') {
                    const busCfg = SYSTEM_CONFIG.busTypes[io.busType];
                    
                    if(busCfg && busCfg.hasSubDevices) {
                        if(!hw.subNodes) hw.subNodes = {};
                        if(!hw.subNodes[io.id]) hw.subNodes[io.id] = [];
                        const subs = hw.subNodes[io.id];

                        let totalAddresses = 0;
                        subs.forEach(s => { totalAddresses += parseInt(s.channels) || 1; });
                        const maxLimit = io.limit || busCfg.defaultLimit || 64;
                        const isFull = totalAddresses >= maxLimit;

                        let subsHtml = '';
                        if (subs.length > 0) {
                            subsHtml = `<table class="dali-table">
                                <thead><tr>
                                    <th>Bezeichnung (${busCfg.subDeviceLabel})</th>
                                    <th>Montageort</th>
                                    <th>Kanäle</th>
                                    <th>Verknüpfungen (Taster / App / Gruppe)</th>
                                    <th style="width: 30px;"></th>
                                </tr></thead><tbody>` + subs.map(sub => {

                                return `
                                <tr>
                                    <td><input type="text" value="${sub.name}" oninput="updateSubNode('${hw.instanceId}', '${io.id}', '${sub.id}', 'name', this.value)"></td>
                                    <td><input type="text" value="${sub.location}" oninput="updateSubNode('${hw.instanceId}', '${io.id}', '${sub.id}', 'location', this.value)"></td>
                                    <td><input type="number" min="1" max="16" value="${sub.channels}" onchange="updateSubNode('${hw.instanceId}', '${io.id}', '${sub.id}', 'channels', this.value)" style="width:50px; border:1px solid transparent; background:transparent;"></td>
                                    <td style="font-size: 0.75rem; color: #475569; line-height: 1.3;">
                                        <b>Taster:</b> ${sub.mapping || '-'}<br>
                                        <b>App:</b> ${sub.appFunctions || '-'}<br>
                                        <b>Gruppe:</b> ${sub.globalGroup || '-'}
                                    </td>
                                    <td style="text-align: right;"><button class="delete-btn" style="padding: 2px 4px;" title="Löschen" onclick="deleteSubNode('${hw.instanceId}', '${io.id}', '${sub.id}')">✕</button></td>
                                </tr>`;
                            }).join('') + `</tbody></table>`;
                        } else {
                            subsHtml = `<div style="font-size:0.85rem; color:#94a3b8; margin:10px 0;">Keine ${busCfg.subDeviceLabel} angelegt.</div>`;
                        }
                        busHtml += `<div class="bus-container"><div class="bus-header"><h5>${busCfg.icon} ${io.label}</h5><span class="bus-limit-badge ${isFull?'full':'ok'}">${totalAddresses}/${maxLimit} Adr. belegt</span></div>${subsHtml}<button class="btn" style="margin-top:10px; padding:6px 12px; font-size:0.85rem;" onclick="addSubNode('${hw.instanceId}', '${io.id}')">+ ${busCfg.subDeviceLabel} hinzufügen</button></div>`;
                    }
                } else {
                    const currentMap = hw.mappings?.[io.id] || '-';
                    const currentApp = hw.appFunctions?.[io.id] || '-';
                    const currentGrp = hw.globalGroup?.[io.id] || '-';
                    const currentBez = hw.bezeichnung?.[io.id] || '';

                    const row = `<div class="io-complex-row" style="margin-bottom:10px; padding:10px; border-left:3px solid ${io.type==='in'?'#3b82f6':'#ef4444'}">
                        <div style="font-weight:bold; font-size:0.85rem; margin-bottom:8px; color:#334155;">${io.label}</div>
                        <div class="io-fields-grid" style="grid-template-columns: 1fr;">
                            <input type="text" placeholder="Bezeichnung (z.B. Deckenlicht)" value="${currentBez}" onchange="updateHwFieldEx('${hw.instanceId}', 'bezeichnung', '${io.id}', this.value)">
                            <div style="font-size: 0.8rem; background: #f8fafc; padding: 8px; border-radius: 4px; border: 1px solid #e2e8f0; line-height: 1.4;">
                                <div style="margin-bottom:2px;"><span style="color:#64748b;">Taster:</span> <b>${currentMap}</b></div>
                                <div style="margin-bottom:2px;"><span style="color:#64748b;">App-Funktion:</span> <b>${currentApp}</b></div>
                                <div><span style="color:#64748b;">Globale Gruppe:</span> <b>${currentGrp}</b></div>
                            </div>
                        </div>
                    </div>`;

                    if(io.type === 'in') inHtml += row; else outHtml += row;
                }
            });

            return `<div class="hw-card"><div class="hw-card-image"><img src="${BASE_ICON_PATH}${cfg.image}"></div><div class="hw-card-body"><div class="hw-card-header"><h4>${cfg.name}</h4><button class="delete-btn" onclick="deleteHardwareComponent('${hw.instanceId}')">Löschen</button></div>${fHtml}<div class="hw-io-grid">${inHtml?`<div><h5>Eingänge</h5>${inHtml}</div>`:''} ${outHtml?`<div><h5>Ausgänge</h5>${outHtml}</div>`:''}</div>${busHtml}</div></div>`;
        }).join('');
    }

    window.updateHwFieldEx = function(hwOrId, dataBlock, ioId, val) {
        let hw = typeof hwOrId === 'string' ? projectData.details.find(x => x.id === activeDetailId).hardware.find(h => h.instanceId === hwOrId) : hwOrId;
        if(!hw[dataBlock]) hw[dataBlock] = {};
        hw[dataBlock][ioId] = val;
        saveToLocal();
    }

    function getAllBusNodes(slaveType=null) {
        let list = [];
        projectData.details.forEach(d => d.hardware && d.hardware.forEach(hw => {
            const c = hardwareConfigList.find(x => x.id === hw.configId);
            if(c) {
                const activeIo = c.profiles ? (c.profiles.find(p=>p.id===hw.activeProfile)?.io || c.profiles[0].io) : c.io;
                if(activeIo) activeIo.forEach(io => {
                    if(io.type === 'bus' || io.busType) {
                        const bType = io.busType || (io.label && io.label.toLowerCase().includes('dali') ? 'dali' : null);
                        if(!slaveType || slaveType === bType || slaveType === 'unknown' || bType === 'unknown') {
                            list.push({value: getBusIdString(d, hw, io)});
                        }
                    }
                });
            }
        }));
        return list;
    }

    function getParentBusId(hw) {
        for (let fieldName in hw.fields) {
            if (/ast|bus|link|bridge|dali/i.test(fieldName) && hw.fields[fieldName]) {
                return hw.fields[fieldName];
            }
        }
        return null;
    }

    function openBusOverviewModal() {
        const c = document.getElementById('bus-tree-content'); c.innerHTML = ''; let h = '';
        
        const allHw = [];
        
        projectData.details.forEach(d => d.hardware && d.hardware.forEach(hw => {
            const cfg = hardwareConfigList.find(x => x.id === hw.configId);
            if(cfg) allHw.push({d, hw, cfg});
        }));

        projectData.details.forEach(d => {
            if (d.frames) {
                d.frames.forEach(f => {
                    for (let slotKey in f.slots) {
                        const slot = f.slots[slotKey];
                        if (slot && slot.iconFile) {
                            const cfg = iconConfigList.find(x => x.file === slot.iconFile);
                            if (cfg && slot.customFields) {
                                const hasBusField = Object.keys(slot.customFields).some(k => /ast|bus|link|bridge|dali/i.test(k) && slot.customFields[k]);
                                if (hasBusField) {
                                    allHw.push({
                                        d: d,
                                        hw: { fields: slot.customFields, configId: slot.iconFile },
                                        cfg: { name: cfg.label, channels: cfg.channels || 1, io: [] }
                                    });
                                }
                            }
                        }
                    }
                });
            }
        });

        const totalPower = getProjectTotalPower();
        h += `<div style="margin-bottom:25px; font-weight:bold; color:#0f766e; font-size:1.1rem; padding-bottom:10px; border-bottom:1px solid #cbd5e1;">⚡ Gesamtstromaufnahme Projekt: ${totalPower.toFixed(1)} W</div>`;

        function getDeviceChannelCount(childItem) {
            if (childItem.cfg.channels) return parseInt(childItem.cfg.channels);
            let fieldChannels = parseInt(childItem.hw.fields['Kanäle'] || childItem.hw.fields['Channels'] || 0);
            if (fieldChannels > 0) return fieldChannels;
            
            const activeIo = childItem.cfg.profiles ? 
                (childItem.cfg.profiles.find(p => p.id === childItem.hw.activeProfile)?.io || childItem.cfg.profiles[0].io) : 
                childItem.cfg.io;
            
            if (activeIo && childItem.hw.subNodes) {
                let subSum = 0;
                for (let ioKey in childItem.hw.subNodes) {
                    childItem.hw.subNodes[ioKey].forEach(sub => {
                        subSum += parseInt(sub.channels) || 1;
                    });
                }
                if (subSum > 0) return subSum;
            }
            return 1;
        }

        function renderTopoNode(item, level) {
            const isRoot = level === 0;
            const activeIo = item.cfg.profiles ? (item.cfg.profiles.find(p=>p.id===item.hw.activeProfile)?.io || item.cfg.profiles[0].io) : item.cfg.io;

            let html = `<div class="topo-master" style="${isRoot ? '' : 'margin-top: 10px; margin-bottom: 5px; border-color:#e2e8f0; box-shadow:none;'}">
                <div class="topo-master-title" style="${isRoot ? '' : 'font-size:1rem; color:#1e293b;'}">
                    ${isRoot ? '🖥️' : '🔌'} ${item.hw.fields['Geräte-Bez.'] || item.cfg.name} 
                    <span style="color:#64748b; font-size:0.85rem; font-weight:normal;">(${item.d.room ? item.d.room + ' - ' : ''}${item.d.name})</span>
                </div>`;
            
            if (activeIo) {
                activeIo.filter(i => i.type === 'bus').forEach(io => {
                    const busIdStr = getBusIdString(item.d, item.hw, io);
                    const children = allHw.filter(c => getParentBusId(c.hw) === busIdStr);
                    const busCfg = SYSTEM_CONFIG.busTypes[io.busType];
                    
                    const maxLimit = io.limit || (busCfg ? busCfg.defaultLimit : null) || (io.busType === 'tree' ? 50 : io.busType === 'air' ? 50 : io.busType === 'link' ? 30 : 64);
                    
                    if (busCfg && busCfg.hasSubDevices) {
                        const subs = (item.hw.subNodes && item.hw.subNodes[io.id]) || [];
                        let totalAddrs = 0;
                        subs.forEach(s => { totalAddrs += parseInt(s.channels) || 1; });
                        children.forEach(child => { totalAddrs += getDeviceChannelCount(child); });

                        const isFull = totalAddrs >= maxLimit;
                        
                        html += `<div class="topo-bus">
                            <div class="topo-bus-title">
                                <span>${busCfg.icon} ${io.label}</span>
                                <span class="topo-badge ${isFull ? 'full' : 'ok'}">${totalAddrs}/${maxLimit} Belegt</span>
                            </div>`;
                
                        if(subs.length === 0 && children.length === 0) {
                            html += `<div class="topo-device" style="color:#94a3b8; font-style:italic; justify-content:center;">Keine Geräte angelegt</div>`;
                        } else {
                            subs.forEach(sub => {
                                let ch = parseInt(sub.channels) || 1;
                                html += `<div class="topo-device">
                                        <div style="font-weight:600; color:#1e293b;">${sub.name || 'Ohne Bezeichnung'}</div>
                                        <div class="topo-device-info">
                                            <span>📍 ${sub.location || '-'}</span>
                                            <span style="color:#0f766e; font-weight:bold;">💡 ${ch} Adr.</span>
                                        </div>
                                       </div>`;
                            });
                            children.forEach(child => {
                                let childCh = getDeviceChannelCount(child);
                                html += `<div class="topo-device">
                                        <div style="font-weight:600; color:#1e293b;">🔌 ${child.hw.fields['Geräte-Bez.'] || child.cfg.name}</div>
                                        <div class="topo-device-info">
                                            <span>📍 ${child.d.name}</span>
                                            <span style="color:#0f766e; font-weight:bold;">💡 ${childCh} Adr.</span>
                                        </div>
                                       </div>`;
                            });
                        }
                        html += `</div>`;
                    } else {
                        let usedCount = 0;
                        children.forEach(child => { usedCount += getDeviceChannelCount(child); });
                        const isFull = usedCount >= maxLimit;

                        html += `<div class="topo-bus">
                            <div class="topo-bus-title">
                                <span>📶 ${io.label}</span>
                                <span class="topo-badge ${isFull ? 'full' : 'ok'}">${usedCount}/${maxLimit} Belegt</span>
                            </div>`;
                
                        if (children.length > 0) {
                            children.forEach(child => { html += renderTopoNode(child, level + 1); });
                        } else {
                            html += `<div class="topo-device" style="color:#94a3b8; font-style:italic; justify-content:center; background:transparent; border:none; box-shadow:none;">Keine Geräte angehängt</div>`;
                        }
                        html += `</div>`;
                    }
                });
            }
            html += `</div>`;
            return html;
        }

        const roots = allHw.filter(item => !getParentBusId(item.hw));
        roots.forEach(root => { h += renderTopoNode(root, 0); });
        
        c.innerHTML = h; 
        document.getElementById('bus-modal').style.display = 'flex';
    }

    function buildDetailPrintHtml(d) {
        let framesHtml = '';
        if(d.frames && d.frames.length > 0) {
            framesHtml = d.frames.map(f => {
                const [r, c] = f.layout.split('x').map(Number); let vSlots = ''; let blocks = [];
                for(let i=1; i<=r*c; i++) {
                    const s = f.slots[`slot-${i}`]; const ic = iconConfigList.find(x=>x.file===s?.iconFile);
                    if(ic) {
                        vSlots += `<div class="print-switch-slot"><img src="icons-schalter/${ic.file}"></div>`;
                        let ioRows = ic.io.map(io => {
                            const dat = s.ioData?.[io.id] || {};
                            return `<div class="print-io-block">
                                <div style="font-weight:bold; color:#0f766e; margin-bottom:4px;">${io.type==='in'?'Eingang':'Ausgang'}: ${io.label}</div>
                                <div class="print-io-grid">
                                    <span style="color:#64748b;">Bezeichnung:</span> <span>${dat.bezeichnung||'-'}</span>
                                    <span style="color:#64748b;">Art:</span> <span>${dat.art||'TA'}</span>
                                    <span style="color:#64748b;">Funktion:</span> <span>${dat.funktion||'-'}</span>
                                    <span style="color:#64748b;">Gruppe:</span> <span>${dat.gruppe||'-'}</span>
                                    <span style="color:#64748b;">Verknüpfung:</span> <span>${dat.eingabegerat||'-'}</span>
                                </div>
                            </div>`;
                        }).join('');
                        blocks.push(`<div class="print-slot-item-block"><b>Platz ${i} - ${ic.label}</b><div style="margin-top:8px;">${ioRows}</div></div>`);
                    }
                }
                if(blocks.length === 0) return '';
                let visHtml = `<div style="display:flex; justify-content:center; margin: 10px 0;"><div class="print-switch-frame" style="grid-template-columns: repeat(${c}, 60px);">${vSlots}</div></div>`;
                let bStr = blocks.map(b => `<div style="margin-bottom: 15px;">${b}</div>`).join('');
                return `<div><div class="print-frame-title">Schaltstelle: ${f.name}</div>${visHtml}${bStr}</div>`;
            }).join('');
            if(framesHtml) framesHtml = `<div class="print-section-title">Schalter Belegungen</div>${framesHtml}`;
        }
        
        let hwHtml = '';
        if(d.hardware.length) {
            hwHtml = `<div class="print-section-title">Hardware</div>` + d.hardware.map(hw => {
                const cfg = hardwareConfigList.find(x=>x.id===hw.configId); if(!cfg) return '';
                const activeIo = cfg.profiles ? (cfg.profiles.find(p=>p.id===hw.activeProfile)?.io || cfg.profiles[0].io) : cfg.io;
                
                let fh = `<div style="display:grid; grid-template-columns: 120px 1fr; gap:2px; font-size:0.85rem; margin-top:8px; margin-bottom:12px;">`;
                if(cfg.fields) cfg.fields.forEach(f => fh += `<div><span style="color:#64748b;">${f}:</span></div> <div><b>${hw.fields[f]||'-'}</b></div>`);
                if(cfg.profiles) {
                    const pName = cfg.profiles.find(p=>p.id===hw.activeProfile)?.label || '';
                    fh += `<div><span style="color:#64748b;">Profil:</span></div> <div><b style="color:#0f766e;">${pName}</b></div>`;
                }
                fh += `</div>`;

                let ioh = ''; if(activeIo) activeIo.forEach(io => { 
                    const busCfg = io.type==='bus' ? SYSTEM_CONFIG.busTypes[io.busType] : null;
                    if(busCfg && busCfg.hasSubDevices && hw.subNodes && hw.subNodes[io.id]) {
                        hw.subNodes[io.id].forEach(sub => {
                            ioh += `<div class="print-hw-sub-block">
                                <div style="font-weight:bold; color:#166534; margin-bottom:4px;">${busCfg.subDeviceLabel}: ${sub.name}</div>
                                <div class="print-io-grid" style="grid-template-columns: 80px 1fr;">
                                    <span style="color:#64748b;">Ort:</span> <span>${sub.location || 'k.A.'}</span>
                                    <span style="color:#64748b;">Kanäle:</span> <span>${sub.channels} Adr.</span>
                                    <span style="color:#64748b;">Taster:</span> <span>${sub.mapping || '-'}</span>
                                    <span style="color:#64748b;">App:</span> <span>${sub.appFunctions || '-'}</span>
                                    <span style="color:#64748b;">Gruppe:</span> <span>${sub.globalGroup || '-'}</span>
                                </div>
                            </div>`;
                        });
                    } else if(io.type!=='bus') {
                        const bez = hw.bezeichnung?.[io.id] || '-';
                        const grp = hw.globalGroup?.[io.id] || '-';
                        const map = hw.mappings?.[io.id] || '-';
                        const app = hw.appFunctions?.[io.id] || '-';
                        ioh += `<div class="print-hw-io-block">
                            <div style="font-weight:bold; color:#1e293b; margin-bottom:4px;">${io.label}</div>
                            <div class="print-io-grid" style="grid-template-columns: 80px 1fr;">
                                <span style="color:#64748b;">Bezeichnung:</span> <span>${bez}</span>
                                <span style="color:#64748b;">Taster:</span> <span>${map}</span>
                                <span style="color:#64748b;">App:</span> <span>${app}</span>
                                <span style="color:#64748b;">Gruppe:</span> <span>${grp}</span>
                            </div>
                        </div>`;
                    }
                });
                return `<div class="print-hw-container"><div class="print-hw-image"><img src="${BASE_ICON_PATH}${cfg.image}"></div><div><div style="font-weight:bold; font-size:0.95rem; color:#1e293b;">${hw.fields['Geräte-Bez.'] || cfg.name}</div>${fh}${ioh}</div></div>`;
            }).join('');
            if(hwHtml) hwHtml = `<div class="print-section-title">Hardware</div>${hwHtml}`;
        }
        
        return `<div class="print-detail-page"><div class="print-header-block"><h2 style="margin:0; color:#0f766e;">${projectData.projectName} - ${d.name}</h2><div style="font-size:0.85rem; color:#64748b;">Standort: ${projectData.location || '-'} | Raum: ${d.room || '-'}</div></div>${framesHtml}${hwHtml}</div>`;
    }

    function updatePrintContainers() {
        const d = projectData.details.find(x => x.id === activeDetailId);
        if(d) {
            document.getElementById('print-single-container').innerHTML = buildDetailPrintHtml(d);
        }
        let allHtml = '';
        projectData.details.forEach(det => { allHtml += buildDetailPrintHtml(det); });
        document.getElementById('print-all-container').innerHTML = allHtml;
    }

    function printCurrentDetail() {
        document.getElementById('print-single-container').style.display = 'block';
        document.getElementById('print-all-container').style.display = 'none';
        window.print();
        setTimeout(() => { document.getElementById('print-single-container').style.display = 'none'; }, 500);
    }

    function printAllDetails() {
        document.getElementById('print-single-container').style.display = 'none';
        document.getElementById('print-all-container').style.display = 'block';
        window.print();
        setTimeout(() => { document.getElementById('print-all-container').style.display = 'none'; }, 500);
    }

    function exportProject() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(projectData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `${projectData.projectName || 'Projekt'}.ServiceProDetail`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function importProject(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const parsed = JSON.parse(e.target.result);
                if(parsed && parsed.details) {
                    projectData = parsed;
                    activeDetailId = projectData.details.length > 0 ? projectData.details[0].id : null;
                    renderApp();
                    alert("Projekt erfolgreich geladen!");
                } else {
                    alert("Ungültiges Dateiformat.");
                }
            } catch(err) {
                alert("Fehler beim Lesen der Datei: " + err.message);
            }
        };
        reader.readAsText(file);
    }
</script>
